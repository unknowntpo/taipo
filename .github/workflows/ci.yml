name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    # Private repo: the owner's MacBook (self-hosted; hosted macOS minutes cost 10x on a private repo).
    # Public repo: GitHub-hosted macOS 26 (arm64; Xcode 26 provides Swift 6.2). The runner is registered
    # only in the private repo, so a wrong expression leaves a public job queued, never on the MacBook.
    runs-on: ${{ github.repository == 'unknowntpo/taipo-private' && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Unit tests
        run: swift test
      - name: Traceability
        run: swift run taipo-dev check-traceability
      - name: Test plan up to date
        run: swift run taipo-dev render-test-plan --check
      - name: Budgets (M1–M3)
        run: swift run -c release taipo-bench
      # xcodebuild compiles MLX and its Metal shaders (~10 min), so only on demand.
      - name: Build input method bundle
        if: github.event_name == 'workflow_dispatch'
        run: |
          xcodebuild -downloadComponent MetalToolchain
          scripts/install-ime.sh --build
  public-sync-dry-run:
    # Spec 019 (Behavior 13): a PR that would leak private data fails here, before merge.
    if: github.repository == 'unknowntpo/taipo-private'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public sync dry run
        run: scripts/public-sync.sh --dry-run --public https://github.com/unknowntpo/taipo.git
